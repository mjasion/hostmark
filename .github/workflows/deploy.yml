# Manual deployment of one platform, or of every enabled one (D70). It never runs on push: a merge to main deploys
# nothing, and a dispatch from any other branch does nothing. Credentials are GitHub Environment secrets, one
# environment per platform, named as in platforms.json, and are set on the deploy step only (D123).
#
# Cloudflare is not deployed here. Its one route is cloudflare-production.yml, which rolls out in steps and rolls back
# by itself; a direct deploy from this file would bypass that. The choice below omits it and the plan job drops it
# from "all" (`--exclude cloudflare`); tools/platform/platform.test.mjs pins both.
#
# What is not wired yet, so a dispatch for these ends in a failed job and deploys nothing:
#   - no cloud login step and no `id-token: write`: AWS_ROLE_ARN is never assumed, GCP has no credentials
#     (adapters/gcp/scripts/deploy.sh needs Application Default Credentials);
#   - only adapters/aws, adapters/gcp and adapters/vercel have a `platform-deploy` script; the other adapters fail with
#     "Missing script" until they get one.
name: deploy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: A platform name from platforms.json, or "all" for every enabled platform
        type: choice
        default: all
        options: [all, local, gcp, aws, railway, fly, vercel, vps]

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      # Fails for a named platform that is disabled, and prints an empty matrix for "all" when none is enabled.
      - id: matrix
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          args=()
          if [ "$PLATFORM" != all ]; then args+=("$PLATFORM"); fi
          matrix=$(pnpm --silent platform matrix "${args[@]}" --exclude cloudflare)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$matrix" | jq '.include | length')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install --global pnpm@12.15.0
      - run: pnpm install --frozen-lockfile
      # Every secret that platforms.json names, as a reference, and only here, so nothing is set during the install.
      # A platform's environment holds only its own, the rest are empty. `deploy` names what is missing. The test in
      # tools/platform/platform.test.mjs keeps this list equal to platforms.json.
      - name: Deploy
        env:
          PLATFORM: ${{ matrix.name }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_CODE_BUCKET: ${{ secrets.AWS_CODE_BUCKET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DOMAIN: ${{ secrets.DOMAIN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_USER: ${{ secrets.VPS_SSH_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: pnpm platform deploy "$PLATFORM"
