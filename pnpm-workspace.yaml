packages:
  - apps/*
  - packages/*
  - adapters/*

storeDir: .pnpm-store

# Packages whose install scripts pnpm 12 may run (D201). Every other dependency with a build script fails a strict
# install, so a new one is a visible change. Never replace this list with dangerouslyAllowAllBuilds.
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  workerd: true

# Transitive releases with published advisories, raised to their first patched release (D249). Each selector names only
# the vulnerable range, so a later dependency update that moves past it makes the entry a no-op; drop it then.
overrides:
  undici@>=7.0.0 <7.30.1: 7.30.1
  sharp@<0.35.5: 0.35.5
  zod@>=4.0.0 <4.6.6: 4.6.7
  minimatch@>=10.0.0 <11.0.1: 11.0.4
  esbuild@<0.25.0: 0.25.12
